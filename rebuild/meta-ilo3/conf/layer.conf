# meta-ilo3 — HP iLO 3 (Gromit-XE) OpenBMC layer (DRAFT, RE-derived)
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ilo3-layer"
BBFILE_PATTERN_ilo3-layer = "^${LAYERDIR}/"
LAYERVERSION_ilo3-layer = "1"
LAYERDEPENDS_ilo3-layer = "core"
# Keep broad; narrow to the OpenBMC release actually used.
LAYERSERIES_COMPAT_ilo3-layer = "nanbield scarthgap styhead walnascar"
