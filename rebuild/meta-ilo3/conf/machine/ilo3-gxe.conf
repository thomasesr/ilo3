#@TYPE: Machine
#@NAME: HP iLO 3 (Gromit-XE)
#@DESCRIPTION: HP ProLiant Gen7 BMC — Gromit-XE ASIC, ARM926EJ-S (ARMv5TEJ).
#              DRAFT scaffolding reconstructed by reverse-engineering iLO3 FW 1.94.

# CPU: ARM926EJ-S / ARMv5TEJ, little-endian (see docs/02).
DEFAULTTUNE ?= "armv5te"
require conf/machine/include/arm/arch-armv5.inc

KERNEL_DEVICETREE = "hpe/ilo3-gxe.dtb"

# No upstream SoC/U-Boot support for Gromit-XE — these are placeholders.
# A port needs: custom irqchip, GXELAN MAC, GXE UART/SMIF/I2C/CPLD/video drivers,
# and a from-scratch U-Boot/SoC bring-up (mainline Linux has no Gromit-XE support).
PREFERRED_PROVIDER_virtual/kernel ?= "linux-ilo3"
# UBOOT_MACHINE = "ilo3_gxe_defconfig"   # TODO: net-new U-Boot board

# 32 MB per-AddressSpace window seen in fw; real DRAM size needs HW confirmation.
# (docs/04, docs/13)

MACHINE_FEATURES += "\
        obmc-host-ipmi \
        obmc-host-state-mgmt \
        obmc-chassis-state-mgmt \
        obmc-bmc-state-mgmt \
        "

# Host interface: IPMI over KCS (0x01F0D400, IRQ 44) -> phosphor-ipmi-kcs.
# Also a custom CHIF/VAS/vUSB server (host PCI fns 103c:3306/3307/3300) is net-new.
