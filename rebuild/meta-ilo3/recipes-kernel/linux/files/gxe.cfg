# HP iLO3 Gromit-XE drivers (RE-derived)
# Interrupt controller (root irqchip, 2 banks / 64 lines)
CONFIG_GXE_IRQ=y
CONFIG_GXE_TIMER=y
# UART (earlycon + ttyGXE console)
CONFIG_SERIAL_GXE=y
CONFIG_SERIAL_GXE_CONSOLE=y
CONFIG_SERIAL_CORE=y
CONFIG_SERIAL_CORE_CONSOLE=y
CONFIG_SERIAL_EARLYCON=y
# I2C/SMBus (8 Gromit-XE engines)
CONFIG_I2C=y
CONFIG_I2C_GXE=y
# SPI-NOR boot flash (SMIF) + MTD partitioning
CONFIG_SPI=y
CONFIG_SPI_MEM=y
CONFIG_SPI_GXE_SMIF=y
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y
CONFIG_MTD_OF_PARTS=y
# System CPLD discrete lines (UID LED, power, PSU) as GPIO
CONFIG_GPIOLIB=y
CONFIG_GPIO_GXE_CPLD=y
CONFIG_LEDS_GPIO=y
# PECI (CPU temperature / config) engine
CONFIG_PECI=y
CONFIG_PECI_GXE=y
# Fan control: CPLD PWM/tach scan-chain hwmon
CONFIG_HWMON=y
CONFIG_SENSORS_GXE_FAN=y
# GXELAN Ethernet MAC (dedicated + sideband/NC-SI) + MDIO
CONFIG_NETDEVICES=y
CONFIG_ETHERNET=y
CONFIG_PHYLIB=y
CONFIG_GXE_GMAC=y
CONFIG_NET_NCSI=y
