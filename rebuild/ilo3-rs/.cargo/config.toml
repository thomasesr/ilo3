# iLO 3 (Gromit-XE, ARM926EJ-S / ARMv5TEJ) bare-metal build config.
#
# Custom target (armv5te-ilo3.json): identical to the stock armv5te-none-eabi
# except it claims atomic-cas + max-atomic-width=32. ARM926 has no LDREX, so
# LLVM lowers atomic CAS to __sync_*_4 / __atomic_*_4 libcalls, which we provide
# in firmware/src/atomics.rs as interrupt-masking (single-core) shims. This is
# what lets embassy-executor (which uses core::sync::atomic CAS) build here.
[build]
target = "armv5te-ilo3.json"

[unstable]
# Tier-3 target: build core + alloc from source (no prebuilt artifacts).
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]
# Allow the custom .json target spec (armv5te-ilo3.json).
json-target-spec = true

[target.armv5te-ilo3]
# NB: the linker script is NOT set here — each crate's build.rs emits its own
# `-Tlink*.x` (firmware → link.x @ 0x20000000, spl → link-spl.x @ 0xFFFF0000),
# so the two bin crates link to different addresses under one target.
rustflags = [
  "-C", "link-arg=--nmagic",      # don't page-align sections (flat image)
  "-C", "target-cpu=arm926ej-s",  # ARMv5TEJ, no VFP/NEON
]
