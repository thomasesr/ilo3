[package]
name = "ilo3-spl"
version = "0.0.1"
edition = "2021"
description = "Gromit-XE first-stage loader (SPL): clock + DDR3 init, load main firmware, jump"

[[bin]]
name = "ilo3-spl"
path = "src/main.rs"
test = false
bench = false

[features]
# Host-pull RAM-boot recovery window (src/recovery.rs). Default-on for bring-up;
# build --no-default-features for a production SPL that boots straight to flash
# (no few-second recovery poll on every boot).
default = ["recovery"]
recovery = []

# No dependencies: the SPL is pure no_std + register pokes. It runs XIP from
# flash at 0xFFFF0000 before DRAM exists, so it must have no .data/.bss touched
# pre-DDR and no heap/atomics — just .text/.rodata in flash + a scratch stack.
[dependencies]
