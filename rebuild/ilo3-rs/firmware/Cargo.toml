[package]
name = "ilo3-fw"
version = "0.0.1"
edition = "2021"
description = "Clean-room iLO 3 (Gromit-XE) BMC firmware — bring-up skeleton"

[[bin]]
name = "ilo3-fw"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Single-core critical section via CPSR IRQ masking (ARMv5 has no LDREX, so
# core::sync::atomic + embassy-sync route through this). Impl in src/critsec.rs.
critical-section = { version = "1.2", features = ["restore-state-bool"] }
